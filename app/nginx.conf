server {
    listen 80;
    server_name localhost;

    # Sirve los archivos estáticos de tu aplicación (HTML, CSS, JS)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy Inverso para la API
    # TODAS las peticiones que empiecen por /api/ se reenvían al servicio 'api'
    location /api/ {
        # 'api' es el nombre del servicio en docker-compose.yml
        # 5000 es el puerto interno de Flask
        proxy_pass http://api:5000; 

        # Configuración estándar para asegurar que la solicitud pase correctamente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}